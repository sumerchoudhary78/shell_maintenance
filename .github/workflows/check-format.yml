name: Check formatting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-qml:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - uses: actions/checkout@v6

      - name: Check QML format
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmlformat --version
          for file in (string match -v 'build/*' **.qml)
            # qmlformat 6.11.1 silently crashes (exit != 0, no output) on some valid
            # files using inline `component` blocks. That is a formatter regression, not
            # an unformatted file, so skip those rather than emit a bogus full-file diff.
            # Conventions are still enforced below via qml-lint-conventions.py.
            if not /usr/lib/qt6/bin/qmlformat $file > /tmp/qmlformat-out 2>/dev/null
              echo "::warning file=$file::qmlformat could not process this file (6.11.1 inline-component crash); skipping format check"
              continue
            end
            diff -u $file /tmp/qmlformat-out; or exit 1
          end
          python3 scripts/qml-lint-conventions.py

  check-cpp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/shell-arch-env:latest

    steps:
      - uses: actions/checkout@v6

      - name: Check C++ format
        shell: fish {0}
        run: |
          clang-format --version
          find plugin extras -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
